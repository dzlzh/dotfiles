onboarding = false

[ui]
tab_bar_position = "bottom"
pane_scrollbars = false
agent_panel_sort = "spaces"

[ui.sound]
enabled = true

[ui.toast]
delivery = "herdr"

[theme]
name = "catppuccin"
auto_switch = false

[keys]
prefix = "ctrl+b"
# General controls, following tmux where an equivalent exists.
help = "prefix+?"
settings = "prefix+shift+s"
detach = "prefix+d"
reload_config = "prefix+r"
open_notification_target = "prefix+o"
workspace_picker = "prefix+w"
goto = "prefix+g"

# Workspaces.
new_workspace = "prefix+shift+n"
new_worktree = "prefix+shift+g"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
previous_workspace = "prefix+shift+h"
next_workspace = "prefix+shift+l"

# Agents.
previous_agent = "prefix+shift+k"
next_agent = "prefix+shift+j"
focus_agent = "prefix+alt+1..9"

# Tabs map to tmux windows.
new_tab = "prefix+c"
rename_tab = "prefix+shift+t"
previous_tab = "prefix+ctrl+h"
next_tab = "prefix+ctrl+l"
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+x"

# Panes follow the tmux vi-style layout keys.
rename_pane = "prefix+shift+p"
edit_scrollback = "prefix+esc"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+shift+r"
toggle_sidebar = "prefix+t"

# Navigate mode keeps the same vi movement keys.
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"
